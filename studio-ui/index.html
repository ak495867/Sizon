<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sizon Studio</title><style>body{margin:0;background:#0b1020;color:#e8eefc;font:15px system-ui}main{max-width:1100px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#141c32;border:1px solid #283653;border-radius:14px;padding:18px}.metric{font-size:28px;font-weight:700}.muted{color:#92a2c4}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #283653;text-align:left}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><header><div><h1>Sizon Studio</h1><div class="muted">Research, robustness, and deployment readiness</div></div><button onclick="refresh()">Refresh</button></header><section class="grid"><div class="card"><div class="muted">Service health</div><div id="health" class="metric">Loading</div></div><div class="card"><div class="muted">Live orders</div><div class="metric">Disabled</div></div><div class="card"><div class="muted">Deployment</div><div id="deploy" class="metric">Fail-closed</div></div></section><section class="card" style="margin-top:16px"><h2>Research runs</h2><table><thead><tr><th>Run</th><th>Strategies</th><th>Report</th></tr></thead><tbody id="runs"><tr><td colspan="3" class="muted">Connect Studio API to populate runs.</td></tr></tbody></table></section></main><script>async function refresh(){try{const r=await fetch('/health');const d=await r.json();document.querySelector('#health').textContent=d.ok?'Healthy':'Alert';}catch(e){document.querySelector('#health').textContent='Offline';}try{const res=await fetch('/api/runs');if(res.ok){const runs=await res.json();const tbody=document.querySelector('#runs');if(runs.length>0){tbody.innerHTML=runs.map(r=>`<tr><td><strong>${r.run_id}</strong></td><td>${r.strategies_saved} evaluated</td><td>${r.has_report?`<a href="${r.report_url}" target="_blank" style="color:#60a5fa;text-decoration:none">View Report &rarr;</a>`:'<span class="muted">Generating...</span>'}</td></tr>`).join('');}else{tbody.innerHTML='<tr><td colspan="3" class="muted">No research runs found.</td></tr>';}}}catch(e){console.error(e);}}refresh()</script></body></html>
